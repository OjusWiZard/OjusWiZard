name: metrics

on:
  # refresh once a day
  schedule:
    - cron: "0 3 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push to the default branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Deliberately NOT the "repositories" base section: nearly all my work lands in org
      # repos (valory-xyz, rotki, hummingbot) rather than repos I own, so owned-repo counters
      # render "1 Repository / 0 Stargazers" and understate everything. The notable plugin
      # names the actual repos instead, which is the honest version of the same claim.
      #
      # No languages card on purpose. "most-used" only sees repos I own (renders 0), and
      # widening it to organization_member would average in every valory-xyz repo whether
      # I touched it or not, resurrecting languages I do not write. There is no accurate
      # way to compute per-author languages here without cloning and analysing every repo.
      - name: generate metrics.base.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.base.svg
          template: classic
          base: header
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          config_theme: dark
          config_timezone: Asia/Kolkata
          extras_css: |
            svg { background: #282a36 !important; color: #f8f8f2 !important; }
            h1, h2 { color: #e36594 !important; }
            .field { color: #f8f8f2 !important; }
            .field svg { fill: #bd93f9 !important; }
            a { color: #8be9fd !important; }
            .calendar .day { outline-color: rgba(255, 255, 255, 0.06) !important; }
            .contribution img { display: none !important; }
            .contribution .name { margin-left: 4px; }
            :root {
              --color-calendar-graph-day-bg: #44475a;
              --color-calendar-graph-day-border: rgba(255, 255, 255, 0.06);
              --color-calendar-graph-day-L1-bg: #6272a4;
              --color-calendar-graph-day-L2-bg: #bd93f9;
              --color-calendar-graph-day-L3-bg: #ff79c6;
              --color-calendar-graph-day-L4-bg: #e36594;
              --color-calendar-graph-day-L1-border: rgba(255, 255, 255, 0.06);
              --color-calendar-graph-day-L2-border: rgba(255, 255, 255, 0.06);
              --color-calendar-graph-day-L3-border: rgba(255, 255, 255, 0.06);
              --color-calendar-graph-day-L4-border: rgba(255, 255, 255, 0.06);
            }
