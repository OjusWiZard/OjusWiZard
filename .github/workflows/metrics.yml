name: metrics

on:
  # refresh once a day
  schedule:
    - cron: "0 3 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push to the default branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Most of my work lands in org repos (valory-xyz, rotki, hummingbot) rather than
      # repos I own, so anything counting "my repositories" reads as ~1 and is useless.
      # Everything below is deliberately contribution-based instead.
      - name: generate metrics.base.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.base.svg
          template: classic
          base: header
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          plugin_notable_indepth: yes
          config_timezone: Asia/Kolkata

      # "recently-used" reads languages off recent commit activity across every repo
      # I push to, including org repos. "most-used" only looks at owned repos, which is
      # why it rendered 0 languages.
      - name: generate metrics.langs.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.langs.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_sections: recently-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_days: 365
          config_timezone: Asia/Kolkata
