name: metrics

on:
  # refresh once a day
  schedule:
    - cron: "0 3 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push to the default branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Header-only card. Deliberately NOT the "repositories" section: nearly all my work
      # lands in org repos (valory-xyz, rotki, hummingbot) rather than repos I own, so
      # owned-repo counters render "1 Repository / 0 Stargazers" and understate everything.
      # The header's "Contributed to N repositories" is the number that actually reflects the work.
      #
      # To unlock the language breakdown and notable-org-contribution cards, create a PAT
      # with `public_repo` + `read:org` scope, save it as a repo secret named METRICS_TOKEN,
      # and swap the token below plus uncomment the second step. The built-in GITHUB_TOKEN
      # is scoped to this repo only, so cross-repo activity reads back empty.
      - name: generate metrics.base.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.base.svg
          template: classic
          base: header
          config_timezone: Asia/Kolkata

      # - name: generate metrics.langs.svg
